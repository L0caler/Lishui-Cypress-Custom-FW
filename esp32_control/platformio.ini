; ESP32 that takes over the current command of the Lishui controller over
; its binary UART protocol (src/lishui_link.h).
;
;   platformio run --target upload
;   platformio device monitor

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@2.5.2
build_flags =
; Debug Bluetooth (hold the push button from power-on): advertised name, and
; the password to type as the first line in Serial Bluetooth Terminal.
; Until then the ESP32 sends nothing; 3 wrong lines drop the connection.
    -D BLE_NAME=\"ESP32\"
    -D BLE_PASSWORD=\"yarak\"
; UART to the controller, defaults shown. GPIO25/26 are the same pins
; psoc1_prog's ESP32 build uses for P1[0]/P1[1], so one harness does both.
;    -D CTRL_RX_GPIO=25     ; <- controller TX, P1[0] (open drain low), internal pull-up
;    -D CTRL_TX_GPIO=26     ; -> controller RX, P1[1]
; BENCH ONLY: power the controller's Vdd from GPIO15 (3.3 V, ~40 mA), the
; same wire psoc1_prog's ESP32 build uses. REMOVE THIS LINE before the
; controller runs from its own supply: the pin would drive against its rail.
;    -D TARGET_PWR_GPIO=15
