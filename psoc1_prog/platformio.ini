; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = megaatmega2560

; Uncomment PWR_ACTIVE_LOW if the target supply is switched by a high side
; p-channel MOSFET driven straight off the pin, so that a low pin powers the
; target. The default assumes a high pin powers the target.
[common]
build_flags =
;    -D PWR_ACTIVE_LOW

[env:megaatmega2560]
build_flags =
    ${common.build_flags}
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
upload_port=COM4

; Classic ESP32 DevKit (WROOM/WROVER). Its pins are not 5 V tolerant, so the
; target must run at 3.3 V or be level shifted. See README.md for the wiring.
;   platformio run -e esp32dev --target upload
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    ${common.build_flags}
; Start in external supply mode (you switch the target supply, the ESP32
; watches ISSP_SENSE_GPIO) instead of powering the target from a GPIO.
; Either way it can be changed at run time with programmer.py --power.
;    -D POWER_EXTERNAL
; Pin map, defaults shown:
;    -D ISSP_SDA_GPIO=25
;    -D ISSP_SCL_GPIO=26
;    -D ISSP_RES_GPIO=27
;    -D ISSP_PWR_GPIO=15
;    -D ISSP_PWR2_GPIO=22   ; second Vdd pin in parallel, off by default
;    -D ISSP_SENSE_GPIO=34
;    -D ISSP_LED_GPIO=2
; Half SCLK period in ns, 1000 = 500 kHz clock:
;    -D ISSP_HALF_NS=1000

